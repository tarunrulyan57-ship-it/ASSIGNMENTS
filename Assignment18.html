<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABC College Admission 2026</title>
    <style>
        body {
            font-family: Georgia, "Times New Roman", serif;
            margin: 0;
            padding: 20px;
            background-color: #ffffff;
            color: #000000;
        }
        .container {
            max-width: 750px;
            margin: 0 auto;
        }
        header {
            background-color: #0d1b6e;
            color: #ffffff;
            text-align: center;
            padding: 20px;
        }
        header h1 {
            margin: 0;
            font-size: 24px;
        }
        main {
            padding: 15px 80px;
        }
        h2 {
            font-size: 20px;
            margin-bottom: 15px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
            font-size: 14px;
        }
        caption {
            font-weight: bold;
            margin-bottom: 6px;
            font-size: 13px;
        }
        th, td {
            border: 1px solid #cccccc;
            padding: 8px 12px;
            text-align: left;
        }
        th {
            background-color: #e6eaf2;
            text-align: center;
        }
        fieldset {
            border: 1px solid #999999;
            padding: 15px 20px;
            margin-bottom: 20px;
        }
        legend {
            font-size: 13px;
            padding: 0 5px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 14px;
            margin-bottom: 4px;
        }
        input[type="text"],
        input[type="email"] {
            width: 240px;
            padding: 4px;
            border: 1px solid #767676;
            border-radius: 2px;
        }
        select {
            padding: 3px 6px;
            font-family: inherit;
        }
        textarea {
            width: 85%;
            height: 45px;
            padding: 4px;
            border: 1px solid #767676;
            border-radius: 2px;
        }
        button {
            padding: 4px 10px;
            font-family: inherit;
            cursor: pointer;
        }
        footer {
            background-color: #0d1b6e;
            color: #ffffff;
            text-align: center;
            padding: 10px;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>ABC College Admission 2026</h1>
        </header>

        <main>
            <section aria-labelledby="courses-heading">
                <h2 id="courses-heading">Courses and Fees</h2>
                <table>
                    <caption>Available Courses</caption>
                    <thead>
                        <tr>
                            <th scope="col">Course</th>
                            <th scope="col">Seats</th>
                            <th scope="col">Fees</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>B.Tech CSE</td>
                            <td>120</td>
                            <td>&#8377;90,000</td>
                        </tr>
                        <tr>
                            <td>BCA</td>
                            <td>60</td>
                            <td>&#8377;45,000</td>
                        </tr>
                    </tbody>
                </table>
            </section>

            <section aria-label="Student Application">
                <form action="#" method="post">
                    <fieldset>
                        <legend>Application Form</legend>

                        <div class="form-group">
                            <label for="name">Name:</label>
                            <input type="text" id="name" name="name" required>
                        </div>

                        <div class="form-group">
                            <label for="email">Email:</label>
                            <input type="email" id="email" name="email" required>
                        </div>

                        <div class="form-group">
                            <label for="course">Course:</label>
                            <select id="course" name="course" required>
                                <option value="btech-cse" selected>B.Tech CSE</option>
                                <option value="bca">BCA</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="statement">Statement:</label>
                            <textarea id="statement" name="statement" required></textarea>
                        </div>

                        <button type="submit">Apply</button>
                    </fieldset>
                </form>
            </section>
        </main>

        <footer>
            &copy; 2026 ABC College
        </footer>
    </div>

</body>
</html>
