<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assignment 8 - Hyperlinks and Images</title>
</head>
<body id="top">

    <p>Links demo</p>

    <!-- External Link -->
    <a href="https://google.com" target="_blank" title="Go to Google">External link</a><br>

    <!-- Internal Link (Jump to bottom) -->
    <a href="#bottom">Jump to bottom</a><br>

    <!-- Email Link -->
    <a href="mailto:admin@example.com">Email us</a><br>

    <!-- Image Link with Attributes (shows 'Logo' alt text if image is missing) -->
    <a href="https://google.com" target="_blank">
        <img src="logo.png" alt="Logo" width="120" height="50">
    </a>

    <!-- Spacing to allow scrolling -->
    <br><br><br><br><br><br><br><br><br><br><br><br><br><br>

    <!-- Bottom Target Section -->
    <p id="bottom">Bottom. <a href="#top">Back to top</a></p>

</body>
</html>
